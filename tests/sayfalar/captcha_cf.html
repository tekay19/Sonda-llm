<!doctype html><html lang="en"><meta charset="utf-8"><title>Robot kontrolü</title>
<h1>Verify you are human</h1>
<iframe id="cf" width="300" height="65" style="border:0"></iframe>
<iframe src="captcha_kutusu.html?recaptcha/api2/anchor&gorunmez" width="0" height="0" style="border:0"></iframe>
<p id="durum">Doğrulanmadı</p>

</script><script>document.getElementById("cf").src = location.origin.replace("127.0.0.1", "localhost") + "/captcha_kapali.html";</script>
</html>
